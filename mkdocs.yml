site_name: morel
site_description: Complete missing item modalities from graph context, then rank with LightGCN.
site_author: Sachin
site_url: https://sachncs.github.io/morel/
site_dir: .mkdocs-site
copyright: >
  Copyright © 2024–2026 Sachin. Released under the MIT License.

repo_url: https://github.com/sachncs/morel
repo_name: sachncs/morel
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - content.code.copy
    - content.tabs.link
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.sections
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: false
    code: false
extra_css:
  - assets/theme.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: numpy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Docs hub: docs-hub.md
  - Tutorials:
      - tutorials/index.md
      - tutorials/synthetic.md
      - tutorials/real-data.md
      - tutorials/serve.md
  - How-to guides:
      - howto/index.md
      - howto/configure.md
      - howto/custom-component.md
      - howto/serve.md
  - Concepts:
      - concepts/index.md
      - concepts/method.md
      - concepts/architecture.md
  - Reference:
      - reference/index.md
      - reference/api.md
      - reference/cli.md
      - reference/config.md
      - reference/fidelity.md
      - reference/benchmarks.md
      - reference/capacity-baseline.md
      - reference/production-readiness.md
      - reference/site-ux-review.md
      - reference/citation.md
      - reference/limitations.md
  - Operations:
      - operations/index.md
      - operations/install.md
      - operations/reproduce.md
      - operations/deploy.md
      - operations/observability.md
      - operations/alerts.md
      - operations/pages.md
  - Project:
      - project/index.md
      - project/plan.md
      - Engineering guide: engineering.md
      - project/changelog.md
      - project/security.md
      - project/contributing.md
      - project/code-of-conduct.md
      - project/license.md
