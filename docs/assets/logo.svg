<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="morel logo">
  <defs>
    <linearGradient id="brand-graph" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3D5AFE"/>
      <stop offset="100%" stop-color="#5E3DAB"/>
    </linearGradient>
  </defs>
  <!-- Bounding square is invisible to keep the mark clean. -->
  <g stroke="url(#brand-graph)" stroke-width="1.6" fill="none" stroke-linecap="round">
    <!-- Outer query ring (the missing-modality case). -->
    <circle cx="48" cy="48" r="34" stroke-dasharray="2 4" opacity="0.4"/>
    <!-- Subgraph of retrieved nodes. -->
    <g>
      <circle cx="48" cy="48" r="3.2" fill="url(#brand-graph)" stroke="none"/>
      <circle cx="20" cy="32" r="2.4" fill="url(#brand-graph)" stroke="none"/>
      <circle cx="76" cy="32" r="2.4" fill="url(#brand-graph)" stroke="none"/>
      <circle cx="20" cy="64" r="2.4" fill="url(#brand-graph)" stroke="none"/>
      <circle cx="76" cy="64" r="2.4" fill="url(#brand-graph)" stroke="none"/>
      <circle cx="34" cy="20" r="2" fill="url(#brand-graph)" stroke="none"/>
      <circle cx="62" cy="20" r="2" fill="url(#brand-graph)" stroke="none"/>
      <circle cx="34" cy="76" r="2" fill="url(#brand-graph)" stroke="none"/>
      <circle cx="62" cy="76" r="2" fill="url(#brand-graph)" stroke="none"/>
    </g>
    <!-- Edges: solid for retrieved, dashed for the missing-modality arc. -->
    <g opacity="0.85">
      <line x1="48" y1="48" x2="20" y2="32"/>
      <line x1="48" y1="48" x2="76" y2="32"/>
      <line x1="48" y1="48" x2="20" y2="64"/>
      <line x1="48" y1="48" x2="76" y2="64"/>
      <line x1="48" y1="48" x2="34" y2="20"/>
      <line x1="48" y1="48" x2="62" y2="20"/>
      <line x1="48" y1="48" x2="34" y2="76"/>
      <line x1="48" y1="48" x2="62" y2="76"/>
    </g>
    <!-- Missing-modality halo: a broken ring that suggests an arc to fill. -->
    <circle cx="48" cy="48" r="11" stroke-dasharray="3 2" opacity="0.55"/>
  </g>
  <!-- Wordmark. -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
     font-weight="600" font-size="22" fill="url(#brand-graph)" letter-spacing="-0.5">
    <text x="48" y="88" text-anchor="middle">morel</text>
  </g>
</svg>
