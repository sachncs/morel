name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy morel/

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Verify built wheel
        run: make audit-artifact

      - name: Audit installed wheel environment
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          pip-audit --strict --local

      - name: Security audit
        run: pip-audit --strict --disable-pip --requirement requirements.lock

      - name: Test
        run: pytest tests/ -n auto --timeout=120

      - name: Verify published test metrics
        run: python scripts/check_verification.py

      - name: Verify documentation examples
        run: python scripts/check_docs.py

      - name: Critical module coverage
        run: make audit-critical

      - name: Failure-injection gate
        run: make fault-injection

      - name: Upload coverage
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  lock:
    name: lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Verify requirements.lock matches pyproject.toml
        run: make lock-check

  determinism:
    name: determinism (repeat run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: The same demo must produce byte-identical output twice
        run: |
          python examples/demo.py > run1.txt
          python examples/demo.py > run2.txt
          diff run1.txt run2.txt
          echo "demo output is reproducible across processes"

  gpu:
    name: gpu smoke
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'run-gpu')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -m gpu --timeout=60 -v

  site:
    name: site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        run: npm install --global pnpm@9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Frontend unit tests
        run: pnpm test:unit
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm test:e2e --project=chromium

  container:
    name: container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --tag morel:ci .
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: morel:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Exercise production health contract
        run: |
          container_id=$(docker run --detach --publish 18080:8080 \
            --env MOREL_ENV=production \
            --env MOREL_AUTH_TOKEN_READ=ci-read-token-123456 \
            --env MOREL_AUTH_TOKEN_ADMIN=ci-admin-token-654321 \
            morel:ci serve --workers 2)
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/health
          ready_status=$(curl --silent --output /tmp/morel-ready.json \
            --write-out '%{http_code}' http://127.0.0.1:18080/health/ready)
          test "$ready_status" = 503
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:18080/health >/dev/null
          done
          docker logs "$container_id"
