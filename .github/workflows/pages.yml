name: Build and deploy product site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install pnpm
        run: |
          npm install -g pnpm@9.15.0
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Pages base path
        run: pnpm exec playwright test --project=chromium
        env:
          BASE_URL: "http://127.0.0.1:4173/morel/"
      - name: Verify rendered documentation
        working-directory: .
        run: |
          test -f site/dist/docs/index.html
          test -f site/dist/docs/project/license/index.html
          grep -q 'Documentation' site/dist/docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live Pages routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://sachncs.github.io/morel"
          root="$(curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 3 --retry-all-errors "$base/")"
          grep -q 'Complete missing modalities' <<<"$root"
          docs="$(curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 3 --retry-all-errors "$base/docs/")"
          grep -q '<title>Documentation · morel</title>' <<<"$docs"
          grep -q 'Documentation' <<<"$docs"
          alerts="$(curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 3 --retry-all-errors "$base/docs/operations/alerts/")"
          grep -q '<title>Alerts and rollback runbook · morel</title>' <<<"$alerts"
