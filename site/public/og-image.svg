    <path d="M100 8v100M16 58l84 50 84-50M16 58l84-50 84 50" fill="none" stroke="#79e3cf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <g fill="#43cbb4" stroke="#09131a" stroke-width="4"><circle cx="16" cy="58" r="11" /><circle cx="184" cy="58" r="11" /><circle cx="100" cy="8" r="11" /><circle cx="100" cy="108" r="11" /></g>
