<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="morel — Robust multimodal recommendation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0e" />
      <stop offset="100%" stop-color="#131318" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a7eff" />
      <stop offset="100%" stop-color="#c4a8ff" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7a7eff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7a7eff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g transform="translate(100, 200)">
    <g stroke="url(#brand)" stroke-width="1.6" fill="none" stroke-linecap="round">
      <circle cx="60" cy="60" r="50" stroke-dasharray="2 6" opacity="0.4" />
      <circle cx="60" cy="60" r="5" fill="url(#brand)" stroke="none" />
      <circle cx="20" cy="28" r="3.6" fill="url(#brand)" stroke="none" />
      <circle cx="100" cy="28" r="3.6" fill="url(#brand)" stroke="none" />
      <circle cx="20" cy="92" r="3.6" fill="url(#brand)" stroke="none" />
      <circle cx="100" cy="92" r="3.6" fill="url(#brand)" stroke="none" />
      <line x1="60" y1="60" x2="20" y2="28" />
      <line x1="60" y1="60" x2="100" y2="28" />
      <line x1="60" y1="60" x2="20" y2="92" />
      <line x1="60" y1="60" x2="100" y2="92" />
      <circle cx="60" cy="60" r="20" stroke-dasharray="2.5 2.5" opacity="0.55" />
    </g>
  </g>

  <g font-family="Inter, system-ui, sans-serif" fill="#ffffff">
    <text x="100" y="430" font-size="96" font-weight="700" letter-spacing="-3">morel</text>
    <text x="100" y="490" font-size="28" font-weight="500" fill="#c4a8ff" letter-spacing="-0.5">Robust multimodal recommendation,</text>
    <text x="100" y="528" font-size="28" font-weight="500" fill="#c4a8ff" letter-spacing="-0.5">one graph at a time.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" fill="#7a7eff">
    <text x="100" y="585">graph retrieval · modality completion · production inference</text>
  </g>
</svg>
